[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torque"
version = "0.1.0"
description = "Torque — revenue-leakage recovery agent. Milestone 1: core data model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

# FastAPI + uvicorn are part of the approved stack but are only added in
# Module 2, alongside the first real HTTP route (the Razorpay webhook
# endpoint). Milestone 1 has no HTTP surface by design.

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/torque"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
