[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torque"
version = "0.1.0"
description = "Torque — revenue-leakage recovery agent. Milestone 1: core data model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    # HTTP surface. Added in Milestone 7a (Module 2 — Signal Ingestion),
    # alongside the first real route: the Razorpay webhook endpoint.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Inbound delayed-job mechanism for Module 2 (Milestone 7b): the §2.3
    # self-recovery buffer. Celery is the Python-native stand-in for the
    # blueprint's "BullMQ + Redis" inbound role (Decision C). Redis is broker
    # only — no result backend; Postgres is the source of truth for ingestion
    # outcomes.
    "celery>=5.4",
    "redis>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    # Starlette's TestClient transport (FastAPI webhook tests, M7a).
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/torque"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom puts callables (Depends/Path/Query) in
# parameter defaults; B008 flags exactly that pattern and does not apply here.
"src/torque/api/*" = ["B008"]
